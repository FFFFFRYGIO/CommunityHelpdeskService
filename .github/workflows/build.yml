name: build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create CI .env (throwaway values generated per run)
        run: |
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "DEBUG=True"
            echo "PG_NAME=helpdesk"
            echo "PG_USER=helpdesk"
            echo "PG_PASSWORD=$(openssl rand -hex 16)"
            echo "PG_PORT=5432"
            echo "DOCKER_PG_HOST=db"
          } > .env
      - name: Start stack (docker compose)
        run: docker compose up -d --build
      - name: Wait for web
        run: |
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && echo up && exit 0; sleep 2; done
          docker compose ps; docker compose logs --tail 80; exit 1
      - name: Django tests
        run: docker compose run --rm web sh -c "python manage.py collectstatic --noinput && python manage.py test tests"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Cypress e2e
        working-directory: end_to_end_tests
        run: npm ci && npx cypress run
      - if: failure()
        run: docker compose logs --tail 100
